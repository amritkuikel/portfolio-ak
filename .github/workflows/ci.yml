# The gates from CLAUDE.md on every pull request and every push to main.
# Each job installs on its own so they run in parallel; pnpm's store is cached.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Builds inline only the public variables (server env is validated at boot, decision 0011).
  VITE_APP_TITLE: Start Template
  VITE_SITE_URL: http://localhost:3000
  # drizzle-kit validates the URL but never connects for generate/check.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  static:
    name: Typecheck, lint, knip, migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check
      - run: pnpm knip
      - name: Migrations match the schema
        run: |
          pnpm exec drizzle-kit generate
          git diff --exit-code -- drizzle || (echo "::error::Schema changed without a migration: run pnpm db:generate and commit drizzle/." && exit 1)
          test -z "$(git status --porcelain -- drizzle)" || (echo "::error::Untracked migration files: run pnpm db:generate and commit drizzle/." && exit 1)
          pnpm db:check

  test:
    name: Unit, server and component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  storybook:
    name: Storybook build and story tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Story tests use the installed Chrome (channel "chrome" in vitest.config.ts);
      # GitHub's Ubuntu runners ship it, so no Playwright browser download is needed.
      - run: pnpm test:storybook
      - run: pnpm build-storybook

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
