# Weekly dependency updates, grouped so related packages move together
# (their versions must match). Exact pins in package.json stay exact (decision 0119).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      tanstack:
        patterns: ["@tanstack/*"]
      storybook:
        patterns: ["storybook", "@storybook/*"]
      vitest:
        patterns: ["vitest", "@vitest/*", "playwright"]
      better-auth:
        patterns: ["better-auth", "@better-auth/*", "auth"]
      tiptap:
        patterns: ["@tiptap/*"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
      drizzle:
        patterns: ["drizzle-orm", "drizzle-kit"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      types:
        patterns: ["@types/*"]
        exclude-patterns: ["@types/react", "@types/react-dom"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
